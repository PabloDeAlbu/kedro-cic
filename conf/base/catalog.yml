# Here you can define all your data sets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html

### REPOSITORY DB
"dspacedb/public/{table}":
  type: pandas.SQLTableDataset
  table_name: "{table}"
  load_args:
    schema: "public"
  credentials: "dspacedb"

"dspace5/public/{table}":
  type: pandas.SQLTableDataset
  table_name: "{table}"
  load_args:
    schema: "public"
  credentials: "dspace5"

"dspacedb/dspace/{table}":
  type: pandas.SQLTableDataset
  table_name: "{table}"
  load_args:
    schema: "dspace"
  credentials: "dspacedb"

"raw/{source}/{entity}":
  type: pandas.CSVDataset
  filepath: "data/01_raw/{source}/{entity}.csv"
  metadata:
    kedro-viz:
      layer: raw

"raw/{source}/{entity}#parquet":
  type: pandas.ParquetDataset
  filepath: "data/01_raw/{source}/{entity}.parquet"
  metadata:
    kedro-viz:
      layer: raw

"raw/openalex/work#batched_parquet":
  type: kedro_cic.io.parquet_batch_dataset.ParquetBatchDataset
  filepath: "data/01_raw/openalex/work.parquet"
  batch_size: 500
  load_args:
    columns:
      - id
      - title
      - display_name
      - publication_year
      - publication_date
      - ids
      - language
      - primary_location
      - type
      - type_crossref
      - open_access
      - countries_distinct_count
      - institutions_distinct_count
      - apc_list
      - apc_paid
      - fwci
      - has_fulltext
      - fulltext_origin
      - cited_by_count
      - citation_normalized_percentile
      - cited_by_percentile_year
      - biblio
      - is_retracted
      - is_paratext
      - primary_topic
      - locations_count
      - best_oa_location
      - referenced_works_count
      - cited_by_api_url
      - updated_date
      - created_date
      - source_system
      - entity_type
      - extract_datetime
      - extract_date
      - institution_ror
      - extract_filters
      - extract_filter_label
      - endpoint
      - api_path
      - _filter_param
      - _filter_value
      - _extract_datetime
  metadata:
    kedro-viz:
      layer: raw

"raw/openalex/work#parquet_authorships":
  type: pandas.ParquetDataset
  filepath: "data/01_raw/openalex/work.parquet"
