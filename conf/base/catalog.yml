### REPOSITORY DB
"dspacedb/public/{table}":
  type: pandas.SQLTableDataset
  table_name: "{table}"
  load_args:
    schema: "public"
  credentials: "dspacedb"

"dspacedb5/public/{table}":
  type: pandas.SQLTableDataset
  table_name: "{table}"
  load_args:
    schema: "public"
  credentials: "dspacedb5"

"dspacedb/dspace/{table}":
  type: pandas.SQLTableDataset
  table_name: "{table}"
  load_args:
    schema: "dspace"
  credentials: "dspacedb"

"voc_mariadb/{table}":
  type: pandas.SQLTableDataset
  table_name: "{table}"
  credentials: "voc_mariadb"

