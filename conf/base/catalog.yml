"raw/{source}/{entity}":
  type: pandas.CSVDataset
  filepath: "data/01_raw/{source}/{entity}.csv"
  metadata:
    kedro-viz:
      layer: raw

"raw/{source}/{entity}#parquet":
  type: pandas.ParquetDataset
  filepath: "data/01_raw/{source}/{entity}.parquet"
  metadata:
    kedro-viz:
      layer: raw

"raw/{source}/{entity}_dev#parquet":
  type: pandas.ParquetDataset
  filepath: "data/01_raw/{source}/{entity}_dev.parquet"
  metadata:
    kedro-viz:
      layer: raw

"raw/google_scholar/html":
  type: partitions.PartitionedDataset
  path: data/01_raw/google-scholar/html
  filename_suffix: ".html"
  dataset:
    type: text.TextDataset

"raw/{source}/{entity}/csv/{filename}":
  type: pandas.CSVDataset
  filepath: data/01_raw/{source}/{entity}/csv/{filename}.csv

"raw/{source}/{entity}/html":
  type: partitions.PartitionedDataset
  path: data/01_raw/{source}/{entity}/html
  filename_suffix: ".html"
  dataset:
    type: text.TextDataset

"raw/{source}/{entity}/parquet/{filename}":
  type: pandas.ParquetDataset
  filepath: data/01_raw/{source}/{entity}/parquet/{filename}.parquet

"memory/openalex/work":
  type: MemoryDataset

"intermediate/{source}/{entity}":
  type: pandas.CSVDataset
  filepath: "data/02_intermediate/{source}/{entity}.csv"
  metadata:
    kedro-viz:
      layer: intermediate

"intermediate/{source}/{entity}#parquet":
  type: pandas.ParquetDataset
  filepath: "data/02_intermediate/{source}/{entity}.parquet"
  metadata:
    kedro-viz:
      layer: intermediate

"primary/{source}/{entity}":
  type: pandas.CSVDataset
  filepath: "data/03_primary/{source}/{entity}.csv"
  metadata:
    kedro-viz:
      layer: primary

"primary/{source}/{entity}#parquet":
  type: pandas.ParquetDataset
  filepath: "data/03_primary/{source}/{entity}.parquet"
  metadata:
    kedro-viz:
      layer: primary

"ldg/{source}/{tablename}":
  type: kedro_cic.io.truncate_append_sql_dataset.TruncateAppendSQLTableDataset
  table_name: "{tablename}"
  load_args:
    schema: "ldg_{source}"
  save_args:
    schema: "ldg_{source}"
  credentials: dw
  truncate: true
  truncate_cascade: false

# staging
"stg_{source}/{dataset}":
  type: pandas.SQLTableDataset
  table_name: "{dataset}"
  save_args:
    schema: "stg_{source}"
    if_exists: replace
  load_args:
    schema: "stg_{source}"
  credentials: dw

"dm/{dataset}":
  type: pandas.SQLTableDataset
  table_name: "{dataset}"
  load_args:
    schema: "dm"
  save_args:
    schema: "dm"
    if_exists: replace
  credentials: dw

"dm_{source}/{dataset}":
  type: pandas.SQLTableDataset
  table_name: "{dataset}"
  load_args:
    schema: "dm_{source}"
  credentials: dw

"dv_{source}/{dataset}":
  type: pandas.SQLTableDataset
  table_name: "{dataset}"
  load_args:
    schema: "dv_{source}"
  credentials: dw
