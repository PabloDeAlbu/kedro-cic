      layer: primary

# landing
"ldg/dspace5/metadatavalue":
  type: kedro_cic.io.truncate_append_sql_dataset.TruncateAppendSQLTableDataset
  table_name: "metadatavalue"
  load_args:
    schema: "ldg_dspace5"
  save_args:
    schema: "ldg_dspace5"
    chunksize: 100
  credentials: dw
  truncate: true
  truncate_cascade: false

"ldg/{source}/{tablename}":
  type: kedro_cic.io.truncate_append_sql_dataset.TruncateAppendSQLTableDataset
  table_name: "{tablename}"
  load_args:
    schema: "ldg_{source}"
  save_args:
    schema: "ldg_{source}"
  credentials: dw
  truncate: true
  truncate_cascade: false

# staging
"stg_{source}/{dataset}":
  type: pandas.SQLTableDataset
  table_name: "{dataset}"
  save_args:
    schema: "stg_{source}"
    if_exists: replace
  load_args:
    schema: "stg_{source}"
  credentials: dw

"dm/{dataset}":
  type: pandas.SQLTableDataset
  table_name: "{dataset}"
  load_args:
    schema: "dm"
  save_args:
    schema: "dm"
    if_exists: replace
  credentials: dw

"dm_{source}/{dataset}":
  type: pandas.SQLTableDataset
  table_name: "{dataset}"
  load_args:
    schema: "dm_{source}"
  credentials: dw

"dv_{source}/{dataset}":
  type: pandas.SQLTableDataset
  table_name: "{dataset}"
  load_args:
    schema: "dv_{source}"
  credentials: dw
